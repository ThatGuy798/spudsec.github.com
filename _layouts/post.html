---
layout: default
---
<div class="prompt"><span class="user">spud@spudsec</span>:<span class="path">~/blog</span>$ <span class="cmd">cat {{ page.slug }}.md</span></div>

<h1>{{ page.title }}</h1>
<p class="tags">
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  {% if page.tags.size > 0 %}<span class="sep">|</span>{% for tag in page.tags %}{{ tag }}{% unless forloop.last %}, {% endunless %}{% endfor %}{% endif %}
</p>

<hr>

{{ content }}

<hr>

<p><a href="{{ '/blog/' | relative_url }}">&larr; back to all posts</a></p>
